{% extends 'layout.html' %}

{% block title %}Editar Método de Pago - FerDel{% endblock %}

{% block content %}
<div class="container-fluid py-4 fade-in-up">
    <!-- Encabezado con botón de volver -->
    <div class="historial-header d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h3 class="fw-bold text-slate-800 mb-1">
                <i class="fas fa-credit-card text-primary me-2"></i>Editar Método de Pago
            </h3>
            <p class="text-muted small mb-0">Modificar el nombre identificativo de la opción de pago</p>
        </div>
        <div>
            <a href="{{ url_for('admin.admin_metodos_pago') }}" class="btn btn-outline-secondary btn-sm px-3 py-2 rounded-3">
                <i class="fas fa-arrow-left me-1"></i> Volver a Métodos
            </a>
        </div>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card-premium-section mb-4">
                <div class="card-body p-4">
                    <form method="POST" novalidate>
                        <!-- Nombre -->
                        <div class="mb-4">
                            <label for="nombre" class="form-label-premium fw-bold mb-1">Nombre del Método de Pago *</label>
                            <input type="text" class="form-control form-control-premium" id="nombre" name="nombre" 
                                   value="{{ metodo.Nombre }}" required maxlength="255" placeholder="Ingrese el nombre del método de pago">
                            <div class="form-text small text-muted mt-1">
                                Ejemplo: Tarjeta de Crédito, Transferencia Bancaria, Efectivo, etc.
                            </div>
                        </div>
                        
                        <!-- Botones de Acción -->
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top border-light">
                            <a href="{{ url_for('admin.admin_metodos_pago') }}" class="btn btn-outline-secondary px-3 py-2 rounded-3">
                                <i class="fas fa-times-circle me-1"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-outline-primary px-3 py-2 rounded-3">
                                <i class="fas fa-save me-1"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
