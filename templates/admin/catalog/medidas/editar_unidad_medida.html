{% extends "layout.html" %}

{% block title %}Editar Unidad de Medida - FerDel{% endblock %}

{% block content %}
<div class="container-fluid py-4 fade-in-up">
    <!-- Encabezado con botón de volver -->
    <div class="historial-header d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h3 class="fw-bold text-slate-800 mb-1">
                <i class="fas fa-ruler text-primary me-2"></i>Editar Unidad de Medida
            </h3>
            <p class="text-muted small mb-0">Modificar la descripción o abreviatura del registro de unidad de medida</p>
        </div>
        <div>
            <a href="{{ url_for('admin.admin_unidades_medidas') }}" class="btn btn-outline-secondary btn-sm px-3 py-2 rounded-3">
                <i class="fas fa-arrow-left me-1"></i> Volver a Unidades
            </a>
        </div>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card-premium-section mb-4">
                <div class="card-body p-4">
                    <form method="POST" novalidate>
                        <!-- ID (No modificable) -->
                        <div class="mb-3">
                            <label class="form-label-premium fw-bold mb-1">ID de la Unidad (Automático)</label>
                            <input type="text" class="form-control form-control-premium bg-light" value="#{{ unidad.ID_Unidad }}" readonly>
                        </div>

                        <!-- Descripción -->
                        <div class="mb-3">
                            <label for="descripcion" class="form-label-premium fw-bold mb-1">Descripción *</label>
                            <input type="text" class="form-control form-control-premium" id="descripcion" name="descripcion" 
                                   value="{{ unidad.Descripcion }}" required maxlength="255" 
                                   placeholder="Ingrese la descripción de la unidad">
                        </div>
                        
                        <!-- Abreviatura -->
                        <div class="mb-4">
                            <label for="abreviatura" class="form-label-premium fw-bold mb-1">Abreviatura</label>
                            <input type="text" class="form-control form-control-premium" id="abreviatura" name="abreviatura" 
                                   value="{{ unidad.Abreviatura or '' }}" maxlength="50" 
                                   placeholder="Ingrese la abreviatura (opcional)">
                        </div>
                        
                        <!-- Botones de Acción -->
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top border-light">
                            <a href="{{ url_for('admin.admin_unidades_medidas') }}" class="btn btn-outline-secondary px-3 py-2 rounded-3">
                                <i class="fas fa-times-circle me-1"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-outline-primary px-3 py-2 rounded-3">
                                <i class="fas fa-save me-1"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
