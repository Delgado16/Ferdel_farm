{% extends "layout.html" %}
{% block title %}{{ titulo }} - FerDel Sistema{% endblock %}

{% block content %}
<div class="container-fluid py-4 fade-in-up">
    <!-- Encabezado con botón de volver -->
    <div class="historial-header d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h3 class="fw-bold text-slate-800 mb-1">
                <i class="fas fa-tag text-primary me-2"></i>{{ titulo }}
            </h3>
            <p class="text-muted small mb-0">Completar la información básica del tipo de gasto</p>
        </div>
        <div>
            <a href="{{ url_for('admin.admin_tipos_gasto') }}" class="btn btn-outline-secondary btn-sm px-3 py-2 rounded-3">
                <i class="fas fa-arrow-left me-1"></i> Volver a Lista
            </a>
        </div>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card-premium-section mb-4">
                <div class="card-body p-4">
                    <form method="POST" novalidate>
                        <div class="row g-3">
                            <!-- Nombre -->
                            <div class="col-md-6">
                                <label class="form-label-premium fw-bold mb-1">Nombre *</label>
                                <input type="text" name="nombre" class="form-control form-control-premium" 
                                       value="{{ tipo.Nombre if tipo else '' }}" required placeholder="Ingrese el nombre del tipo de gasto">
                            </div>
                            
                            <!-- Origen -->
                            <div class="col-md-6">
                                <label class="form-label-premium fw-bold mb-1">Origen *</label>
                                <select name="origen" id="origen" class="form-select form-select-premium" required>
                                    <option value="GASTO_DIRECTO" {% if tipo and tipo.Origen == 'GASTO_DIRECTO' %}selected{% endif %}>
                                        💸 Gasto Directo
                                    </option>
                                    <option value="INVENTARIO" {% if tipo and tipo.Origen == 'INVENTARIO' %}selected{% endif %}>
                                        📦 Inventario
                                    </option>
                                </select>
                            </div>
                            
                            <!-- Categoría de Inventario -->
                            <div class="col-md-6" id="div_categoria_inventario" style="display: none;">
                                <label class="form-label-premium fw-bold mb-1">Categoría de Inventario</label>
                                <select name="id_categoria_inventario" class="form-select form-select-premium">
                                    <option value="">Seleccione...</option>
                                    {% for cat in categorias_inventario %}
                                    <option value="{{ cat.ID_Categoria }}" 
                                            {% if tipo and tipo.ID_Categoria_Inventario == cat.ID_Categoria %}selected{% endif %}>
                                        {{ cat.Descripcion }}
                                    </option>
                                    {% endfor %}
                                </select>
                                <div class="form-text small text-muted">Solo aplicable para tipos con origen INVENTARIO.</div>
                            </div>
                            
                            <!-- Estado -->
                            <div class="col-md-6">
                                <label class="form-label-premium fw-bold mb-1">Estado</label>
                                <select name="estado" class="form-select form-select-premium">
                                    <option value="Activo" {% if tipo and tipo.Estado == 'Activo' %}selected{% endif %}>Activo</option>
                                    <option value="Inactivo" {% if tipo and tipo.Estado == 'Inactivo' %}selected{% endif %}>Inactivo</option>
                                </select>
                            </div>
                            
                            <!-- Descripción -->
                            <div class="col-12">
                                <label class="form-label-premium fw-bold mb-1">Descripción</label>
                                <textarea name="descripcion" class="form-control form-control-premium" rows="3" placeholder="Detalles u observaciones del tipo de gasto...">{{ tipo.Descripcion if tipo else '' }}</textarea>
                            </div>
                        </div>
                        
                        <!-- Botones de Acción -->
                        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top border-light">
                            <a href="{{ url_for('admin.admin_tipos_gasto') }}" class="btn btn-outline-secondary px-3 py-2 rounded-3">
                                <i class="fas fa-times-circle me-1"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-outline-primary px-3 py-2 rounded-3">
                                <i class="fas fa-save me-1"></i> Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- jQuery (necesario para la lógica de visualización interactiva) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    function toggleCategoriaInventario() {
        var origen = $('#origen').val();
        if (origen === 'INVENTARIO') {
            $('#div_categoria_inventario').show();
        } else {
            $('#div_categoria_inventario').hide();
            $('#div_categoria_inventario select').val('');
        }
    }
    
    $('#origen').change(toggleCategoriaInventario);
    toggleCategoriaInventario();
});
</script>
{% endblock %}
